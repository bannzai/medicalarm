# お薬一覧カード右下の Switch を OFF にして、服薬画面からテスト薬が消えることを確認する。
# Switch の Snackbar「一時停止しました」を検証。
appId: com.bannzai.medicalarm
---
- runFlow: full_pause_feature.yaml
- tapOn:
    point: "87%,27%"
- extendedWaitUntil:
    visible: "一時停止しました"
    timeout: 5000
- tapOn:
    point: "7%,8%"
- extendedWaitUntil:
    notVisible: "(?s).*テスト薬.*"
    timeout: 5000
