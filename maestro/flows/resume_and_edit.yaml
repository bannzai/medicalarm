# 一時停止した状態から、カード Switch を再度 ON にして服薬画面にテスト薬が戻ることを確認する。
# Snackbar「薬の服用を再開しました」を検証。
# 前提の一時停止は toggle_switch.yaml を呼ばずにこのフローで作る。toggle_switch は服用中を前提に再開から始めるため、
# 一時停止のまま呼ぶと再開→停止の 2 往復になる (#373)。
appId: com.bannzai.medicalarm
---
- runFlow: full_pause_feature.yaml
- tapOn:
    id: "medicine_pause_switch"
- extendedWaitUntil:
    visible: "薬の服用を一時停止しました"
    timeout: 5000
- tapOn: "戻る"
- extendedWaitUntil:
    notVisible: "(?s).*テスト薬.*"
    timeout: 5000
# 服薬画面 AppBar 右上の編集アイコン（IconButton tooltip "薬を編集"）
- tapOn: "薬を編集"
- extendedWaitUntil:
    visible: "お薬一覧"
    timeout: 15000
- tapOn:
    id: "medicine_pause_switch"
- extendedWaitUntil:
    visible: "薬の服用を再開しました"
    timeout: 5000
- tapOn: "戻る"
- extendedWaitUntil:
    visible: "(?s).*テスト薬.*"
    timeout: 5000
