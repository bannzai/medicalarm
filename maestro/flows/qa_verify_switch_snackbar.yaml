# QA証跡取得用flow。お薬一覧でSwitchを1回だけタップしSnackbarをtakeScreenshotで捕捉する。
# full_pause_feature.yaml がテスト薬の登録〜お薬一覧への遷移まで行うため、クリーンな環境でも単体実行できる。
# 注意: medicine_pause_switch の Semantics identifier はカードごとに重複するため、お薬一覧にテスト薬以外の薬があると意図しないカードを操作する可能性がある。
appId: com.bannzai.medicalarm
---
- runFlow: full_pause_feature.yaml
- tapOn:
    id: "medicine_pause_switch"
- extendedWaitUntil:
    visible: "(?s).*(一時停止しました|再開しました).*"
    timeout: 5000
- takeScreenshot: qa_switch_single_tap
