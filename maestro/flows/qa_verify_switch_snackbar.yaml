# QA証跡取得用flow。お薬一覧でSwitchを1回だけタップし、SnackbarをtakeScreenshotで捕捉する。
# full_pause_feature.yaml がテスト薬を服用中に揃えてからお薬一覧へ遷移するため、タップは一時停止の方向になる (#373)。
# Snackbar (表示 4 秒) は runner が重いと tapOn の完了待ち (約 19 秒の実例) の間に消えるため、Snackbar の表示は検証せず、
# tapOn の直後に撮影してから Switch の状態 (checked) で一時停止を確かめる (#480)。Snackbar が写るかは撮影の時点しだいなので、
# 証跡として使う際は撮影画像に Snackbar が写っていることを確認してから添付する。
# full_pause_feature.yaml がテスト薬の登録〜お薬一覧への遷移まで行うため、クリーンな環境でも単体実行できる。
# 注意: medicine_pause_switch の Semantics identifier はカードごとに重複するため、お薬一覧にテスト薬以外の薬があると意図しないカードを操作する可能性がある。
# スクリーンショットは gitignore 済みの ./tmp/ に出力し、working tree を汚さない。
appId: com.bannzai.medicalarm
---
- runFlow: full_pause_feature.yaml
- tapOn:
    id: "medicine_pause_switch"
- takeScreenshot: tmp/qa_switch_single_tap
- extendedWaitUntil:
    visible:
      id: "medicine_pause_switch"
      checked: false
    timeout: 5000
