# カレンダー機能の E2E (#62):
# カレンダータブ → 月間カレンダー表示 → 今日の日付タップで日付詳細シート表示 →
# 「日記を書く」から日記を保存 → シートに保存したメモが反映されることを確認する。
appId: com.bannzai.medicalarm
---
- runFlow: allow_notification.yaml
# タブの accessibility ラベルは「カレンダー\nタブ: 3/4」のため、改行を跨いで前方一致させる
- tapOn: "(?s)カレンダー.*"
- takeScreenshot: tmp/maestro/calendar_page
# 今日の日付タイルをタップする。日付は実行日に依存するため実行時に算出する
- evalScript: ${output.todayDay = String(new Date().getDate())}
- tapOn: "${output.todayDay}"
- extendedWaitUntil:
    visible: "日記"
    timeout: 5000
- assertVisible: "服薬履歴"
- takeScreenshot: tmp/maestro/calendar_day_detail_sheet
- tapOn: "日記を書く"
- extendedWaitUntil:
    visible: "保存"
    timeout: 5000
- tapOn: "メモ"
- inputText: "今日の体調メモ E2E"
- takeScreenshot: tmp/maestro/diary_post_page
- tapOn: "保存"
# DiaryPostPage が閉じてシートに戻り、保存した日記のメモが表示される
- extendedWaitUntil:
    visible: "今日の体調メモ E2E"
    timeout: 5000
- takeScreenshot: tmp/maestro/calendar_day_detail_after_save
