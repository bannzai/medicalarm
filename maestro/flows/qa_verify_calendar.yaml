# カレンダー機能の E2E (#62):
# カレンダータブ → 月間カレンダー表示 → 今日の日付タップで日付詳細シート表示 →
# 日記を保存(未作成なら新規、作成済みなら編集) → シートに保存したメモが反映されることを確認する。
# 日記の有無どちらの状態からでも同じ結果に収束するため、繰り返し実行できる(冪等)。
appId: com.bannzai.medicalarm
---
- runFlow: helpers/allow_notification.yaml
# タブの accessibility ラベルは「カレンダー\nタブ: 3/4」のため、改行を跨いで前方一致させる
- tapOn: "(?s)カレンダー.*"
- takeScreenshot: tmp/maestro/calendar_page
# 今日の日付タイルをタップする。日付は実行日に依存するため実行時に算出する。
# 月初の行の前月のグレーアウトの日付と数字が重なる日 (月末寄り) に前月側をタップしないよう、数字の文字列ではなく
# 当月の日付だけに付いた identifier (calendar_day_tile_yyyy-MM-dd) で探す (#387)
- evalScript: ${output.todayDate = (function (date) { return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') })(new Date())}
- tapOn:
    id: "calendar_day_tile_${output.todayDate}"
- extendedWaitUntil:
    visible: "日記"
    timeout: 5000
- assertVisible: "服薬履歴"
- takeScreenshot: tmp/maestro/calendar_day_detail_sheet
# 日記が無い日は「日記を書く」、既にある日(再実行時)は編集アイコン(tooltip: 日記を編集)から開く。
# 日記の取得中はどちらも出ない(インジケータ)ため、取得が終わるまで待ってから分岐する (#373)
- extendedWaitUntil:
    visible: "(日記を書く|日記を編集)"
    timeout: 15000
# 「日記を編集」を先に判定する。「日記を書く」をタップした後の投稿画面では「日記を書く」が見えないため、
# notVisible で分岐すると投稿画面で「日記を編集」を探しに行って失敗する (#373)
- runFlow:
    when:
      visible: "日記を編集"
    commands:
      - tapOn: "日記を編集"
- runFlow:
    when:
      visible: "日記を書く"
    commands:
      - tapOn: "日記を書く"
- extendedWaitUntil:
    visible: "保存"
    timeout: 5000
- tapOn:
    id: "diary_post_memo_field"
# 編集導線で開いた場合の既存メモを消してから入力し、どちらの導線でも同じメモに収束させる
- eraseText: 120
- inputText: "今日の体調メモ E2E"
- takeScreenshot: tmp/maestro/diary_post_page
- tapOn: "保存"
# DiaryPostPage が閉じてシートに戻り、保存した日記のメモが表示される
- extendedWaitUntil:
    visible: "今日の体調メモ E2E"
    timeout: 5000
- takeScreenshot: tmp/maestro/calendar_day_detail_after_save
