# 起動直後のダイアログを閉じてから「テスト薬」を新規登録し、服薬画面で終わる。
# 既に「テスト薬」が登録済みの環境（連続実行時や Firestore 残存時）は登録ステップをスキップする。
# 登録済みかの判定と登録はお薬一覧画面で行う。服薬画面は一時停止中の薬を表示しないため、
# 服薬画面の可視性で判定すると一時停止中に 2 件目を登録してしまう (#373)。
appId: com.bannzai.medicalarm
---
- runFlow: helpers/allow_notification.yaml
- runFlow: helpers/open_medicines_page.yaml
- runFlow:
    when:
      notVisible: "(?s).*テスト薬.*"
    commands:
      - tapOn: "お薬を追加"
      - tapOn: "薬の名前"
      - inputText: "テスト薬"
      - tapOn: "完了"
      - tapOn: "服用スケジュールを追加"
      - tapOn: "保存"
# MedicinesPageSection は Semantics 上 1 ノードに束ねられ accessibilityText が "テスト薬\n自分\n10:00" になるため、複数行を含む正規表現で検出する
- extendedWaitUntil:
    visible: "(?s).*テスト薬.*"
    timeout: 5000
- runFlow: helpers/back_from_medicines_page.yaml
- extendedWaitUntil:
    visible: "(?s)服薬.*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
