# 初回起動のオンボーディング (JP 短尺) を完走し、結果画面からプレミアム紹介シート (ペイウォール) を開いて閉じ、
# 服薬画面に到達する helper。新規の匿名ユーザー (AppUser 作成から 1 日以内・オンボーディング未完了) でのみ表示される。
# `runFlow: onboarding.yaml` で allow_notification.yaml から呼び出して使用する。
# helpers/ 配下は `maestro test maestro/flows` の実行対象に含まれない (allow_notification.yaml の先頭コメントを参照)。
appId: com.bannzai.medicalarm
---
# CI の runner では、タップがアプリで処理されないまま tapOn が完了することがある (#552・#583)。次の画面の選択肢が出るまでタップからやり直す。
# 遅れて処理された 1 回目のタップで次の画面へ進んだ後に押す対象が無いまま失敗しないよう、「はじめる」が見えている間だけタップする
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "はじめる"
          commands:
            - tapOn: "はじめる"
      - extendedWaitUntil:
          visible: "たまにある"
          timeout: 5000
- tapOn: "たまにある"
- tapOn: "自分"
- tapOn: "2回"
- tapOn: "1〜2種類"
# プラン生成演出 (約 2.4 秒) の後に結果画面が出る
- extendedWaitUntil:
    visible: "プランを始める"
    timeout: 10000
- tapOn: "プランを始める"
# 既存のプレミアム紹介シート。左上の閉じるボタン (CloseButton のツールチップ「閉じる」) で閉じる
- extendedWaitUntil:
    visible: "プレミアムプラン"
    timeout: 10000
- tapOn: "閉じる"
- extendedWaitUntil:
    notVisible: "プレミアムプラン"
    timeout: 5000
- extendedWaitUntil:
    visible: "最初のお薬を登録しましょう"
    timeout: 15000
- assertVisible: "08:00"
- assertVisible: "19:00"
- takeScreenshot: tmp/onboarding-followup-registration
- tapOn: "あとで"
