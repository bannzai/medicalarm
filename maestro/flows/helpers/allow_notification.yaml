# アプリを起動し、起動直後の OS ダイアログや初回プロモーション画面を閉じる helper フロー。
# 処理対象（順不同、前後どちらで出る可能性もあるため repeat で複数回スキャンする）:
#   1. 通知許可ダイアログ（"許可"）
#   2. ATT ダイアログ（"アプリにトラッキングしないように要求"）
#   3. 初回の Special Gift（★5レビュー）プロモーション（"今はしない"）
#   4. 開発ビルドで出る AdMob native ad validator 警告（"Dismiss"）
#   5. 新規ユーザーの初回起動で出るオンボーディング（"はじめる" が見えたら onboarding.yaml で完走する）
# `runFlow: helpers/allow_notification.yaml` で他フローから呼び出して使用する。
# helpers/ 配下は `maestro test maestro/flows` の実行対象 (config.yaml の flows の既定 `*` = ルート直下のみ) に含まれない。
# 単独で実行すると、オンボーディング完了済みのユーザーでは「はじめる」が無く失敗するため (#373)。
appId: com.bannzai.medicalarm
---
- launchApp:
    clearState: false
# 初回起動の Firebase 初期化中は白画面になるため、操作可能な画面が出てから分岐する。
- extendedWaitUntil:
    visible: "(?s)(はじめる|設定.*|許可|今はしない|アプリにトラッキングしないように要求|Dismiss)"
    timeout: 240000
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: "許可"
          commands:
            - tapOn: "許可"
      - runFlow:
          when:
            visible: "アプリにトラッキングしないように要求"
          commands:
            - tapOn: "アプリにトラッキングしないように要求"
      - runFlow:
          when:
            visible: "今はしない"
          commands:
            - tapOn: "今はしない"
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "はじめる"
          commands:
            - runFlow: onboarding.yaml
# 状態を消した直後の初回起動では、画面にオンボーディングが出ていても Flutter のアクセシビリティ要素が
# しばらく空のままで (run 38090611530 の失敗時の hierarchy はステータスバーだけ)、上の repeat が全て skip で終わる。
# アプリの要素が取れるようになるまで待ち、その時点で「はじめる」が見えていればオンボーディングを完走する (#373)
- extendedWaitUntil:
    visible: "(?s)(はじめる|設定.*|お薬が未登録です)"
    timeout: 240000
- runFlow:
    when:
      visible: "はじめる"
    commands:
      - runFlow: onboarding.yaml
