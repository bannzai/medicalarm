# iOS Simulator セッションを張る caller workflow。実体は bannzai/simtunnel の session.yml（reusable workflow）。
# 参照: https://github.com/bannzai/simtunnel の PROJECT.md「各アプリ repo での実行」
name: simulator-session
# run-name は local/simtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} device=${{ inputs.device }}"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    # session / device / duration_minutes は local/simtunnel の up が常に送るため宣言必須
    # （未定義の input を送ると dispatch が拒否される）
    inputs:
      session:
        description: "セッション名。tailnet ホスト名 simtunnel-<session> になる（小文字英数字とハイフンのみ）"
        required: true
        default: medicalarm
      device:
        description: "Simulator のデバイス名"
        required: true
        default: iPhone 17
      duration_minutes:
        description: "セッション維持時間（分）"
        required: true
        default: "60"
      serve_sim:
        description: "serve-sim (ブラウザ preview) を起動する。runner のメモリに余裕を持たせたい時は false"
        required: false
        default: "true"

jobs:
  # Simulator 用 .app (debug) をビルドして artifact に上げる
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read # checkout のみ。OIDC token (id-token) は session job だけに与える
    steps:
      # duration_minutes は session.yml 側で検証されず keepalive の算術式にそのまま入るため、
      # secrets・OIDC を使う前のここで正の整数 (上限は session job の timeout と同じ 360) に絞る
      - name: 入力を検証
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]] && [ "$DURATION_MINUTES" -ge 1 ] && [ "$DURATION_MINUTES" -le 360 ] || {
            echo "duration_minutes は 1〜360 の整数: $DURATION_MINUTES" >&2
            exit 1
          }
      # simtunnel 経路の workflow は uses を commit SHA で固定する（simtunnel PROJECT.md「リポジトリ公開に耐える安全性」）
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # ビルドが参照する git 管理外の 2 ファイルを Secrets から復元する（Makefile の make secret と同じ生成物）:
      # - ios/Firebase/GoogleService-Info.plist（FILE_FIREBASE_IOS: base64 化した plist）
      # - lib/secret/secret.dart（secret.dart.sample の REVENUE_CAT_PUBLIC_API_KEY 置換）
      - name: Restore GoogleService-Info.plist / secret.dart
        env:
          FILE_FIREBASE_IOS: ${{ secrets.FILE_FIREBASE_IOS }}
          REVENUE_CAT_PUBLIC_API_KEY: ${{ secrets.REVENUE_CAT_PUBLIC_API_KEY }}
        run: |
          # secret が空のまま進むと後段の Xcode / Dart コンパイルで分かりにくく失敗するため、ここで検査して止める
          [ -n "$FILE_FIREBASE_IOS" ] || { echo "Error: FILE_FIREBASE_IOS が空" >&2; exit 1; }
          [ -n "$REVENUE_CAT_PUBLIC_API_KEY" ] || { echo "Error: REVENUE_CAT_PUBLIC_API_KEY が空" >&2; exit 1; }
          printf '%s' "$FILE_FIREBASE_IOS" | base64 -d > ios/Firebase/GoogleService-Info.plist
          [ -s ios/Firebase/GoogleService-Info.plist ] || { echo "Error: GoogleService-Info.plist の復元に失敗" >&2; exit 1; }
          sed -e "s|\[REVENUE_CAT_PUBLIC_API_KEY\]|$REVENUE_CAT_PUBLIC_API_KEY|g" lib/secret/secret.dart.sample > lib/secret/secret.dart
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: '3.41.9'
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: simulator-app
          path: build/ios/iphonesimulator # .app の親ディレクトリ（.app 直指定は中身が flatten される）

  session:
    needs: build
    # id-token: write が必要なのは reusable workflow を呼ぶこの job だけのため、job 単位で最小権限にする
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する（更新時は SHA を書き換える）
    uses: bannzai/simtunnel/.github/workflows/session.yml@031ba3bb123bbc201205dcd9ecad09d49681392c # main 2026-09-01
    with:
      session: ${{ inputs.session }}
      device: ${{ inputs.device }}
      duration_minutes: ${{ inputs.duration_minutes }}
      serve_sim: ${{ inputs.serve_sim }}
      app_artifact: simulator-app
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
