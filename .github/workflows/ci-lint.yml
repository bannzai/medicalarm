# managed-by: setup-ci (bannzai/castle)
# setup-ci のテンプレートに、このアプリの設定ファイル準備を追加している。
name: CI 静的解析 (Flutter)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: 依存関係を取得する
        run: flutter pub get
      # 実際のキーは不要。サンプルの引用符を既存の lint 規約に合わせる。
      - name: 解析用の設定サンプルを配置する
        run: sed "s/\"/'/g" lib/secret/secret.dart.sample > lib/secret/secret.dart
      - name: 静的解析を実行する
        run: flutter analyze
