<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>お薬手帳のシール</title>
    <style>
      /* お薬手帳のページに貼られた調剤明細シール。感熱プリンタ印字を模して等幅フォントで組む。
         Chrome の --screenshot はビューポートをそのまま切り取るため、page は window-size と同じ 700x900 に固定する。 */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 700px;
        height: 900px;
        overflow: hidden;
      }
      body {
        font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans CJK JP', Osaka, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .notebook-page {
        position: relative;
        width: 700px;
        height: 900px;
        background: #f9f4e6;
        /* 手帳の罫線。38px 間隔は一般的な B6 お薬手帳の罫線幅に近い */
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 37px,
          #c9d3de 37px,
          #c9d3de 38px
        );
        overflow: hidden;
      }
      .page-margin-line {
        position: absolute;
        left: 56px;
        top: 0;
        width: 1px;
        height: 900px;
        background: #e0b3ae;
      }
      .page-header {
        position: absolute;
        left: 76px;
        top: 22px;
        font-size: 19px;
        color: #6d7a86;
      }

      .seal {
        position: absolute;
        left: 42px;
        top: 108px;
        width: 612px;
        padding: 28px 30px 24px;
        background: #fefefe;
        border: 1px solid #ded9cd;
        transform: rotate(-1.3deg);
        box-shadow: 3px 5px 9px rgba(0, 0, 0, 0.22);
        font-family: 'Osaka-Mono', 'Noto Sans Mono CJK JP', monospace;
        color: #2c2c2c;
        font-size: 23px;
        line-height: 1.5;
      }
      .seal .row {
        display: flex;
      }
      .seal .row .right {
        margin-left: auto;
      }
      .seal .rule {
        border-top: 1px dashed #7d7d7d;
        margin: 12px 0;
      }
      .medicine {
        margin-bottom: 18px;
      }
      /* 薬名と数量は実物と同じく列で揃える。最長の「モンテルカスト錠10mg「KM」」が入る幅にする */
      .medicine .row span:first-child {
        display: inline-block;
        min-width: 340px;
      }
      .medicine .row .right {
        margin-left: 0;
        min-width: 100px;
        text-align: right;
      }
      .medicine .usage {
        padding-left: 34px;
      }
      .medicine .usage span:first-child {
        min-width: 306px;
      }
      .seal .clinic-row {
        font-size: 21px;
      }
      .seal-footer {
        display: flex;
        align-items: flex-end;
        margin-top: 6px;
      }
      .seal-footer .pharmacy {
        font-size: 21px;
        line-height: 1.5;
      }
      .qr {
        margin-left: auto;
        width: 96px;
        height: 96px;
        padding: 4px;
        background: #fff;
        display: grid;
        grid-template-columns: repeat(21, 1fr);
        grid-template-rows: repeat(21, 1fr);
      }
      .qr span {
        background: #1c1c1c;
      }
    </style>
  </head>
  <body>
    <div class="notebook-page">
      <div class="page-margin-line"></div>
      <div class="page-header">2026年9月</div>

      <div class="seal">
        <div class="row clinic-row">
          <span>2026年 9月 1日</span><span class="right">○○内科クリニック</span>
        </div>
        <div class="rule"></div>

        <div class="medicine">
          <div class="row"><span>レバミピド錠100mg「EE」</span><span class="right">3錠</span></div>
          <div class="row usage"><span>1日3回 毎食後</span><span class="right">14日分</span></div>
        </div>
        <div class="medicine">
          <div class="row"><span>モンテルカスト錠10mg「KM」</span><span class="right">1錠</span></div>
          <div class="row usage"><span>1日1回 就寝前</span><span class="right">14日分</span></div>
        </div>
        <div class="medicine">
          <div class="row"><span>カロナール錠300mg</span><span class="right">1回1錠</span></div>
          <div class="row usage"><span>発熱時・頭痛時に服用</span><span class="right">10回分</span></div>
        </div>

        <div class="rule"></div>
        <div class="seal-footer">
          <div class="pharmacy">みどり調剤薬局<br />TEL 03-0000-0000</div>
          <div class="qr" id="qr"></div>
        </div>
      </div>
    </div>

    <script>
      // QR コード風のモザイク。実際にデコードできる必要はないが、再生成のたびに絵柄が変わると
      // fixture の差分が出るため、固定 seed の線形合同法で決定的に組み立てる。
      const qrModuleCount = 21;
      const qr = document.getElementById('qr');
      let randomState = 20260901;
      const nextBit = () => {
        randomState = (randomState * 1103515245 + 12345) % 2147483648;
        return (randomState >> 16) % 2 === 1;
      };
      // 3 隅の切り出しシンボル。QR らしく見えるかどうかはこの位置模様で決まる。
      const isFinderPattern = (row, column) => {
        for (const [originRow, originColumn] of [
          [0, 0],
          [0, 14],
          [14, 0],
        ]) {
          const localRow = row - originRow;
          const localColumn = column - originColumn;
          if (localRow < 0 || localRow > 6 || localColumn < 0 || localColumn > 6) {
            continue;
          }
          const ring = Math.max(Math.abs(localRow - 3), Math.abs(localColumn - 3));
          return { filled: ring !== 2 };
        }
        return null;
      };
      for (let row = 0; row < qrModuleCount; row += 1) {
        for (let column = 0; column < qrModuleCount; column += 1) {
          const finder = isFinderPattern(row, column);
          if (finder ? finder.filled : nextBit()) {
            const module = document.createElement('span');
            module.style.gridRow = row + 1;
            module.style.gridColumn = column + 1;
            qr.appendChild(module);
          }
        }
      }
    </script>
  </body>
</html>
